# LINet pretraining on the 100K-frame ScanNet subset, no Modality Dropout.
# Phase 1 of the No-MD ScanNet-pretrained recipe; produces the checkpoint
# fine-tuned by sunrgbd_linet_no_md_scannet_pretrained.yaml.
#
# Source: Paper Appendix Table B3 footnote, "No MD" pretraining (shares
# every hyperparameter with the Progressive-MD pretraining except the MD
# schedule, which is disabled).
# Reported on ScanNet (val) MCA (Fusion / RGB-only / Depth-only): 99.8 / 94.6 / 27.4
# The collapsed Depth-only stream (27.4) is the same co-dependence reversal
# the SUN RGB-D from-scratch experiments exhibit (paper §4.4.1).

meta:
  paper_table: "Table B3 footnote (No-MD pretraining)"
  reported_mca_scannet_val:
    fusion: 99.8
    rgb_only: 94.6
    depth_only: 27.4
  phase: pretrain
  schedule: no_md

dataset:
  name: scannet_100k
  data_root: data/scannet_100k
  batch_size: 128
  num_workers: 4
  num_classes: null
  use_hha: false
  stratified: false
  normalize: true

model:
  architecture: li_resnet18
  stream_input_channels: [3, 1]
  width_multiplier: 0.75
  dropout_p: 0.13
  num_classes: null
  device: cuda
  use_amp: true

optimizer:
  type: adamw
  lr: 3.14e-4
  weight_decay: 4.01e-4
  stem_lr_multiplier: 16.0

scheduler:
  type: cosine
  t_max: 50
  eta_min: 3.0e-6
  warmup_epochs: 0
  warmup_start_factor: 1.0

training:
  epochs: 50
  grad_clip_norm: 1.20
  label_smoothing: 0.07
  monitor: val_mca
  early_stopping: false
  restore_best_weights: false
  seed: 42

augmentation:
  rgb_aug_prob: 0.43
  rgb_aug_mag: 0.80
  depth_aug_prob: 0.54
  depth_aug_mag: 0.70

modality_dropout:
  enabled: false
